<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PokeLorePanels Publisher - TikTok sign-in</title>
<style>body{font-family:system-ui,Segoe UI,Arial,sans-serif;max-width:720px;margin:40px auto;padding:0 16px;line-height:1.6;color:#1b1838;background:#f4f0e6}h1{color:#e8402f}code{display:block;word-break:break-all;background:#fff;padding:12px;border:1px solid #ccc;border-radius:6px}button{margin-top:10px;padding:8px 14px}</style></head>
<body><h1>TikTok sign-in</h1><p id="msg">Reading the response from TikTok…</p><code id="code"></code><button id="copy" hidden>Copy code</button>
<p>Paste the code into the PowerShell window that started the sign-in. It expires within minutes. This page does not store or send it anywhere.</p>
<script>
const q=new URLSearchParams(location.search),c=q.get('code'),e=q.get('error');
const m=document.getElementById('msg'),k=document.getElementById('code'),b=document.getElementById('copy');
if(c){m.textContent='Signed in. Your one-time code:';k.textContent=c;b.hidden=false;b.onclick=()=>navigator.clipboard.writeText(c).then(()=>b.textContent='Copied');}
else{m.textContent=e?('TikTok returned an error: '+e+' '+(q.get('error_description')||'')):'No code in the address. Start the sign-in from the publisher first.';k.hidden=true;}
</script></body></html>
